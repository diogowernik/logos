name: CI
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash scripts/setup.sh
      - run: .venv/bin/ruff check api
      - run: .venv/bin/python api/manage.py test
        env:
          DJANGO_ENV: development
      - run: .venv/bin/python api/manage.py makemigrations --check --dry-run
        env:
          DJANGO_ENV: development
      - run: npm run lint && npm test && npm run typecheck && npm run build
        working-directory: web
        env:
          NEXT_DIST_DIR: .next-codex
      - run: .venv/bin/python scripts/test_auth.py
