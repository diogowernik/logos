[project]
name = "logos-api"
version = "0.1.0"
description = "Aplicação logos"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Django>=5.2.8,<5.3",
    "djangorestframework>=3.16,<4",
    "djoser>=2.3,<3",
    "django-cors-headers>=4.7,<5",
    "dj-database-url>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "Pillow>=11,<13",
    "EbookLib>=0.19,<0.21",
    "Markdown>=3.7,<4",
    "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
production = [
    "gunicorn>=23",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
